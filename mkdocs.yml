site_name: romda
site_description: Real-time reduced-order modelling and bias-aware data assimilation
site_author: Andrea Nóvoa
site_url: https://andreanovoa.github.io/real-time-bias-aware-DA/

repo_url: https://github.com/andreanovoa/real-time-bias-aware-DA
repo_name: andreanovoa/real-time-bias-aware-DA

docs_dir: docs

theme:
  name: material
  icon:
    logo: material/waveform
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.suggest
    - toc.follow

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy
            docstring_section_style: table
            show_source: true
            show_root_heading: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            merge_init_into_class: true
            inherited_members: false
            filters: ["!^_", "^__call__$"]

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.tabbed:
      alternate_style: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Concepts:
      - Architecture: concepts/architecture.md
      - Bias-aware data assimilation: concepts/bias-aware-da.md
  - Tutorials: tutorials.md
  - API reference:
      - Overview: api/index.md
      - Ensemble: api/ensemble.md
      - Data assimilation filters: api/data_assimilation.md
      - Bias estimators: api/bias_estimators.md
      - Models: api/models.md
      - Observations: api/observations.md
      - Tools (POD / SPOD / ESN core): api/tools.md
  - Publications: publications.md

not_in_nav: |
  2023_CMAME_Erratum.pdf
